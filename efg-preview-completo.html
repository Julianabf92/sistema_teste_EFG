<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EFG · Sistema de Gestão Interna (Preview)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
    --color-primary: #269c41;
    --color-primary-dark: #005932;
    --color-primary-light: #90c78e;
    --color-secondary: #2dac6a;
    --color-info: #007ea5;
    --color-navy: #102d69;
    --color-warning: #b8860b;
    --color-danger: #c23a2e;
    --color-danger-bg: #fbeae8;
    --color-warning-bg: #fbf3e0;
    --color-success-bg: #e9f7ee;
    --color-info-bg: #e6f4f8;
    --color-bg: #f7f9f8;
    --color-surface: #ffffff;
    --color-border: #e3e8e6;
    --color-border-strong: #cbd3d0;
    --color-text-primary: #12211a;
    --color-text-secondary: #4c5c55;
    --color-text-muted: #7c8b85;
    --color-sidebar-bg: var(--color-navy);
    --color-sidebar-text: #c7d3ea;
    --color-sidebar-item-active-bg: rgba(45, 172, 106, 0.22);
    --color-focus-ring: #0babe4;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-full: 999px;
    --shadow-sm: 0 1px 2px rgba(16, 45, 105, 0.06);
    --shadow-md: 0 4px 12px rgba(16, 45, 105, 0.08);
    --shadow-lg: 0 12px 28px rgba(16, 45, 105, 0.12);
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
  }
  [data-theme="dark"] {
    --color-bg: #0d1512;
    --color-surface: #16261e;
    --color-border: #223027;
    --color-border-strong: #2d3c33;
    --color-text-primary: #eef3f0;
    --color-text-secondary: #aebcb4;
    --color-text-muted: #7c8b85;
    --color-danger-bg: #2c1a18;
    --color-warning-bg: #2b2415;
    --color-success-bg: #12291c;
    --color-info-bg: #10222a;
    --color-sidebar-bg: #0a1730;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 4px 14px rgba(0,0,0,.35);
    --shadow-lg: 0 16px 32px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Exo 2', system-ui, sans-serif;
    background: var(--color-bg); color: var(--color-text-primary);
    transition: background .2s ease, color .2s ease;
  }
  #app { min-height: 100vh; }
  button, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }

  /* ---------- LOGIN ---------- */
  .login { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; }
  .login__panel {
    background: linear-gradient(165deg, var(--color-navy) 0%, var(--color-primary-dark) 100%);
    color: #fff; display: flex; flex-direction: column; justify-content: center;
    padding: 64px; gap: 24px;
  }
  .login__brand { display: flex; align-items: center; gap: 12px; }
  .login__brand-mark {
    width: 44px; height: 44px; border-radius: var(--radius-md);
    background: var(--color-secondary); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; flex-shrink: 0;
  }
  .login__brand-name { font-weight: 700; font-size: 20px; margin: 0; }
  .login__brand-sub { font-size: 12px; color: rgba(255,255,255,.65); margin: 2px 0 0; }
  .login__tagline { font-size: 30px; font-weight: 800; max-width: 420px; line-height: 1.2; margin: 0; }
  .login__desc { color: rgba(255,255,255,.75); max-width: 400px; font-size: 15px; margin: 0; }
  .login__form-side { display: flex; align-items: center; justify-content: center; padding: 32px; }
  .login__form {
    width: 100%; max-width: 380px; background: var(--color-surface);
    border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    padding: 32px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 16px;
  }
  .login__form h2 { margin: 0; font-size: 22px; font-weight: 600; }
  .login__form p.hint { margin: 0 0 4px; font-size: 14px; color: var(--color-text-secondary); }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-secondary); }
  .field-control {
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md); padding: 0 12px; background: var(--color-surface);
  }
  .field-control:focus-within { border-color: var(--color-info); box-shadow: 0 0 0 3px rgba(11,171,228,.15); }
  .field-control input { flex: 1; border: none; outline: none; background: transparent; height: 42px; color: var(--color-text-primary); font-size: 15px; }
  .field-control button { background: transparent; border: none; color: var(--color-text-muted); cursor: pointer; display: flex; }
  .login__row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--color-text-secondary); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 16px; border-radius: var(--radius-md); border: 1px solid transparent;
    font-weight: 600; font-size: 15px; cursor: pointer; background: var(--color-primary); color: #fff;
    transition: background .12s ease;
  }
  .btn:hover { background: var(--color-primary-dark); }
  .btn--ghost { background: transparent; color: var(--color-text-secondary); border-color: var(--color-border-strong); }
  .btn--ghost:hover { background: var(--color-bg); color: var(--color-text-primary); }
  .btn--sm { height: 32px; font-size: 13px; padding: 0 12px; }
  .login__alert {
    display: flex; align-items: center; gap: 8px; background: var(--color-danger-bg); color: var(--color-danger);
    border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px;
  }

  /* ---------- APP SHELL ---------- */
  .shell { display: none; }
  .shell.active { display: block; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: 240px; height: 100vh;
    background: var(--color-sidebar-bg); color: var(--color-sidebar-text);
    display: flex; flex-direction: column; z-index: 20; border-right: 1px solid rgba(255,255,255,.08);
  }
  .sidebar__brand { display: flex; align-items: center; gap: 12px; padding: 20px; height: 64px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar__brand-mark {
    width: 34px; height: 34px; border-radius: var(--radius-md); background: var(--color-primary);
    display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; flex-shrink: 0;
  }
  .sidebar__brand-text { line-height: 1.2; }
  .sidebar__brand-text b { color: #fff; font-size: 15px; display: block; }
  .sidebar__brand-text span { font-size: 11px; opacity: .8; }
  .sidebar__nav { flex: 1; padding: 12px; overflow-y: auto; }
  .sidebar__item {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-md);
    color: var(--color-sidebar-text); font-size: 13px; font-weight: 500; cursor: pointer;
    margin-bottom: 2px; transition: background .12s ease, color .12s ease; border: none; background: transparent; width: 100%; text-align: left;
  }
  .sidebar__item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .sidebar__item.active {
    background: var(--color-sidebar-item-active-bg); color: #fff; font-weight: 600;
    box-shadow: inset 3px 0 0 var(--color-secondary);
  }
  .sidebar__footer { border-top: 1px solid rgba(255,255,255,.08); padding: 12px; display: flex; align-items: center; gap: 8px; }
  .sidebar__avatar { width: 30px; height: 30px; border-radius: var(--radius-full); background: var(--color-secondary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .sidebar__user-name { font-size: 13px; font-weight: 600; color: #fff; }
  .sidebar__user-role { font-size: 11px; color: var(--color-sidebar-text); }
  .sidebar__logout { margin-left: auto; background: transparent; border: none; color: var(--color-sidebar-text); cursor: pointer; }

  .main { margin-left: 240px; min-height: 100vh; }
  .header {
    height: 64px; background: var(--color-surface); border-bottom: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 10;
  }
  .header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .header p { font-size: 13px; color: var(--color-text-secondary); margin: 2px 0 0; }
  .header__actions { display: flex; align-items: center; gap: 12px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: var(--radius-md); border: 1px solid var(--color-border);
    background: var(--color-surface); color: var(--color-text-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .icon-btn:hover { background: var(--color-bg); color: var(--color-text-primary); }
  .badge-dot { position: absolute; top: -3px; right: -3px; width: 15px; height: 15px; border-radius: 50%; background: var(--color-danger); color: #fff; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .content { padding: 24px; max-width: 1300px; margin: 0 auto; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
  .stat-card__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .stat-card__top span.label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-secondary); }
  .stat-card__icon { width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--color-success-bg); color: var(--color-primary-dark); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .stat-card__value { font-size: 28px; font-weight: 800; margin: 4px 0; }
  .stat-card__trend { font-size: 13px; color: var(--color-text-muted); margin: 0; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .section-title { font-size: 16px; font-weight: 600; margin: 0 0 16px; }
  .list-item { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: var(--radius-md); }
  .list-item:hover { background: var(--color-bg); }
  .list-icon { width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--color-warning-bg); color: var(--color-warning); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .list-text { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .list-title { font-size: 13px; font-weight: 600; }
  .list-caption { font-size: 12px; color: var(--color-text-muted); }
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; }
  .badge--warning { background: var(--color-warning-bg); color: var(--color-warning); }
  .badge--info { background: var(--color-info-bg); color: var(--color-info); }
  .badge--success { background: var(--color-success-bg); color: var(--color-primary-dark); }
  .badge--danger { background: var(--color-danger-bg); color: var(--color-danger); }
  .timeline-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-secondary); flex-shrink: 0; }

  /* Module placeholder */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
    padding: 64px 24px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-lg); background: var(--color-surface);
  }
  .empty-state__icon { width: 52px; height: 52px; border-radius: var(--radius-full); background: var(--color-info-bg); color: var(--color-info); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 22px; }
  .empty-state h3 { margin: 0; font-size: 18px; }
  .empty-state p { margin: 0; font-size: 13px; color: var(--color-text-secondary); max-width: 360px; }

  /* Laboratorios table module */
  .toolbar { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); }
  .tab {
    background: transparent; border: none; border-bottom: 2px solid transparent; padding: 10px 16px;
    font-size: 13px; font-weight: 500; color: var(--color-text-secondary); cursor: pointer;
  }
  .tab.active { color: var(--color-primary-dark); border-color: var(--color-primary); font-weight: 600; }
  .tab .count { background: var(--color-bg); color: var(--color-text-secondary); font-size: 11px; padding: 0 6px; border-radius: var(--radius-full); margin-left: 6px; }
  .tab.active .count { background: var(--color-success-bg); color: var(--color-primary-dark); }
  .toolbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .search-input { display: flex; align-items: center; gap: 8px; border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); padding: 0 12px; height: 40px; max-width: 320px; flex: 1; color: var(--color-text-muted); background: var(--color-surface); }
  .search-input input { border: none; outline: none; background: transparent; flex: 1; font-size: 14px; color: var(--color-text-primary); }
  .table-wrapper { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 12px 16px; background: var(--color-bg); color: var(--color-text-secondary); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
  tbody td { padding: 12px 16px; border-bottom: 1px solid var(--color-border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--color-bg); }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }

  @media (max-width: 900px) {
    .login { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid2 { grid-template-columns: 1fr; }
  }

/* ---------- Extras para módulos adicionais ---------- */
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
.summary-card { display: flex; flex-direction: column; gap: 6px; }
.summary-card .label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-secondary); }
.summary-card .value { font-size: 26px; font-weight: 800; margin: 0; }

.row-list { display: flex; flex-direction: column; gap: 2px; }
.row-item { display: flex; align-items: center; gap: 16px; padding: 12px 8px; border-radius: var(--radius-md); flex-wrap: wrap; }
.row-item:hover { background: var(--color-bg); }
.row-info { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 180px; }
.row-day { font-size: 13px; font-weight: 600; }
.row-meta { display: flex; align-items: center; gap: 12px; }

.badge--neutral { background: var(--color-border); color: var(--color-text-secondary); }

.alert-box { display: flex; gap: 10px; padding: 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 16px; }
.alert-box--warning { background: var(--color-warning-bg); color: var(--color-warning); }
.alert-box--danger { background: var(--color-danger-bg); color: var(--color-danger); }
.alert-box--info { background: var(--color-info-bg); color: var(--color-info); }

.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
.report-card { display: flex; flex-direction: column; gap: 10px; }
.report-card-icon { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-info-bg); color: var(--color-info); display: flex; align-items: center; justify-content: center; font-size: 17px; }

.badges-wrap { display: flex; flex-wrap: wrap; gap: 4px; }

.settings-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); margin-bottom: 16px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--color-border); }
.settings-row:last-child { border-bottom: none; }
.settings-row-title { font-size: 13px; font-weight: 600; margin: 0 0 2px; }

.switch { position: relative; display: inline-flex; align-items: center; width: 38px; height: 22px; border-radius: 999px; background: var(--color-border-strong); cursor: pointer; flex-shrink: 0; transition: background .12s ease; }
.switch.on { background: var(--color-primary); }
.switch__thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .12s ease; }
.switch.on .switch__thumb { transform: translateX(16px); }

.field-disabled { opacity: .6; }

@media (max-width: 900px) {
  .summary-grid, .grid3 { grid-template-columns: 1fr; }
}

  </style>
</head>

                <td><span class="badge badge--${BUSCA_TONE[a.status]}">${BUSCA_LABEL[a.status]}</span></td>
                <td><div class="row-actions">
                  <button class="btn btn--ghost btn--sm" data-busca-detalhe="${a.id}">Detalhes</button>
                  ${a.status !== 'resolvido' ? `<button class="btn btn--ghost btn--sm" data-busca-resolver="${a.id}">Resolver</button>` : ''}
                </div></td>
              </tr>
            `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderProfessores() {
  const q = state.profQuery.toLowerCase();
  const filtered = professores.filter(p => !q || p.nome.toLowerCase().includes(q));
  return `
    <div class="card toolbar" style="flex-direction:row;align-items:center;">
      <div class="search-input">\u{1F50D} <input id="prof-search" placeholder="Buscar por professor…" value="${state.profQuery}" /></div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Professor</th><th>Disciplina principal</th><th>Cursos vinculados</th><th>Carga horária</th><th>Status</th><th style="text-align:right;">Ações</th></tr></thead>
        <tbody>
          ${filtered.map(p => `
            <tr>
              <td>${p.nome}</td><td>${p.disciplina}</td>
              <td><div class="badges-wrap">${p.cursos.map(c => `<span class="badge badge--info">${c}</span>`).join('')}</div></td>
              <td>${p.carga}h/semana</td>
              <td><span class="badge badge--${p.status === 'ativo' ? 'success' : 'warning'}">${p.status === 'ativo' ? 'Ativo' : 'Em licença'}</span></td>
              <td><div class="row-actions"><button class="btn btn--ghost btn--sm" data-prof-editar="${p.id}">\u{270F}\u{FE0F} Editar vínculos</button></div></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderConflitos() {
  const tabs = [
    { key: 'aberto', label: 'Abertos' }, { key: 'resolvido', label: 'Resolvidos' },
    { key: 'ignorado', label: 'Ignorados' }, { key: 'todos', label: 'Todos' },
  ];
  const abertosAlta = conflitos.filter(c => c.status === 'aberto' && c.severidade === 'alta').length;
  const filtered = conflitos.filter(c => {
    const matchStatus = state.confFilter === 'todos' || c.status === state.confFilter;
    const q = state.confQuery.toLowerCase();
    const matchQuery = !q || c.turma.toLowerCase().includes(q) || c.tipo.toLowerCase().includes(q);
    return matchStatus && matchQuery;
  });
  return `
    ${abertosAlta > 0 ? `<div class="alert-box alert-box--danger">\u{1F6A8} <span>${abertosAlta} conflito(s) de alta severidade em aberto — recomendamos priorizá-los.</span></div>` : ''}
    <div class="card toolbar">
      <div class="tabs">
        ${tabs.map(t => `<button class="tab ${state.confFilter === t.key ? 'active' : ''}" data-conf-tab="${t.key}">${t.label}<span class="count">${t.key === 'todos' ? conflitos.length : conflitos.filter(c => c.status === t.key).length}</span></button>`).join('')}
      </div>
      <div class="search-input">\u{1F50D} <input id="conf-search" placeholder="Buscar por turma, aluno ou tipo…" value="${state.confQuery}" /></div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Turma / Aluno</th><th>Tipo</th><th>Descrição</th><th>Detectado em</th><th>Severidade</th><th>Status</th><th style="text-align:right;">Ações</th></tr></thead>
        <tbody>
          ${filtered.length === 0 ? `<tr><td colspan="7" style="text-align:center;color:var(--color-text-muted);padding:32px;">Nenhum conflito encontrado</td></tr>` :
            filtered.map(c => `
              <tr>
                <td>${c.turma}</td><td>${c.tipo}</td><td style="max-width:240px;">${c.desc}</td><td>${c.data}</td>
                <td><span class="badge badge--${SEV_TONE[c.severidade]}">${SEV_LABEL[c.severidade]}</span></td>
                <td><span class="badge badge--${CONF_TONE[c.status]}">${CONF_LABEL[c.status]}</span></td>
                <td><div class="row-actions">${c.status === 'aberto' ? `<button class="btn btn--ghost btn--sm" data-conf-resolver="${c.id}">Resolver</button><button class="btn btn--ghost btn--sm" data-conf-ignorar="${c.id}">Ignorar</button>` : ''}</div></td>
              </tr>
            `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderRelatorios() {
  return `
    <div class="grid3">
      ${tiposRelatorio.map(t => `
        <div class="card report-card">
          <span class="report-card-icon">${t.icon}</span>
          <div><h3 style="margin:0 0 4px;font-size:15px;">${t.nome}</h3><p style="margin:0;font-size:13px;color:var(--color-text-secondary);">${t.desc}</p></div>
          <button class="btn btn--ghost btn--sm" style="align-self:flex-start;" data-rel-gerar="${t.id}">Gerar relatório</button>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <h2 class="section-title">Relatórios gerados recentemente</h2>
      <div class="table-wrapper" style="border:none;">
        <table>
          <thead><tr><th>Relatório</th><th>Período</th><th>Gerado em</th><th>Formato</th><th style="text-align:right;">Ações</th></tr></thead>
          <tbody>
            ${historicoRelatorios.map(h => `
              <tr><td>${h.nome}</td><td>${h.periodo}</td><td>${h.geradoEm}</td><td>${h.formato}</td>
              <td><div class="row-actions"><button class="btn btn--ghost btn--sm" data-rel-baixar="1">\u{2B07}\u{FE0F} Baixar</button></div></td></tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderConfiguracoes() {
  const tabs = [
    { key: 'perfil', label: 'Perfil' }, { key: 'aparencia', label: 'Aparência' },
    { key: 'notificacoes', label: 'Notificações' }, { key: 'seguranca', label: 'Segurança' },
  ];
  const tabsHtml = `<div class="settings-tabs">${tabs.map(t => `<button class="tab ${state.settingsTab === t.key ? 'active' : ''}" data-settings-tab="${t.key}">${t.label}</button>`).join('')}</div>`;

  let body = '';
  if (state.settingsTab === 'perfil') {
    body = `
      <div class="field" style="max-width:380px;"><label>Nome</label><div class="field-control"><input value="${state.email ? state.email.split('@')[0] : ''}" /></div></div>
      <div class="field field-disabled" style="max-width:380px;margin-top:12px;"><label>E-mail</label><div class="field-control"><input value="${state.email}" disabled /></div></div>
      <div class="field field-disabled" style="max-width:380px;margin-top:12px;"><label>Vínculo</label><div class="field-control"><input value="colaborador" disabled /></div></div>
      <button class="btn" style="margin-top:16px;">Salvar alterações</button>
    `;
  } else if (state.settingsTab === 'aparencia') {
    body = `
      <div class="settings-row">
        <div><p class="settings-row-title">Modo escuro</p><p style="margin:0;font-size:13px;color:var(--color-text-secondary);">Alterna entre tema claro e escuro em todo o sistema.</p></div>
        <span class="switch ${state.theme === 'dark' ? 'on' : ''}" id="settings-theme-switch"><span class="switch__thumb"></span></span>
      </div>
    `;
  } else if (state.settingsTab === 'notificacoes') {
    const items = [
      ['email', 'Notificações por e-mail', 'Receber um resumo das atividades por e-mail.'],
      ['solicitacoes', 'Novas solicitações', 'Avisar quando houver novas solicitações pendentes.'],
      ['conflitos', 'Conflitos de matrícula', 'Avisar quando um novo conflito for detectado.'],
      ['resumo', 'Resumo semanal', 'Receber um resumo geral toda segunda-feira.'],
    ];
    body = items.map(([key, title, desc]) => `
      <div class="settings-row">
        <div><p class="settings-row-title">${title}</p><p style="margin:0;font-size:13px;color:var(--color-text-secondary);">${desc}</p></div>
        <span class="switch ${state.notif[key] ? 'on' : ''}" data-notif-switch="${key}"><span class="switch__thumb"></span></span>
      </div>
    `).join('');
  } else if (state.settingsTab === 'seguranca') {
    body = `
      <div class="alert-box alert-box--info">\u{2139}\u{FE0F} <span>Alteração de senha e demais itens de segurança dependem da API de autenticação existente — esta seção está preparada visualmente para integração futura.</span></div>
      <div class="field field-disabled" style="max-width:380px;"><label>Senha atual</label><div class="field-control"><input type="password" disabled placeholder="••••••••" /></div></div>
      <div class="field field-disabled" style="max-width:380px;margin-top:12px;"><label>Nova senha</label><div class="field-control"><input type="password" disabled placeholder="••••••••" /></div></div>
      <button class="btn btn--ghost" disabled style="margin-top:16px;">Alterar senha</button>
    `;
  }

  return `<div class="card">${tabsHtml}${body}</div>`;
}

function bindEvents() {
  const loginForm = document.getElementById('login-form');
  if (loginForm) {
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      state.email = email; state.password = password;
      if (!email.includes('@') || password.length < 4) {
        state.loginError = 'E-mail ou senha inválidos.';
        render();
        return;
      }
      state.loginLoading = true; state.loginError = '';
      render();
      setTimeout(() => { state.loginLoading = false; state.authed = true; render(); }, 500);
    });
    document.getElementById('toggle-pw')?.addEventListener('click', () => {
      state.showPassword = !state.showPassword; render();
    });
    return;
  }

  document.getElementById('logout')?.addEventListener('click', () => { state.authed = false; state.page = 'dashboard'; render(); });
  document.getElementById('theme-toggle')?.addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); });
  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => { state.page = el.dataset.nav; render(); }));

  // Laboratórios
  document.querySelectorAll('[data-lab-tab]').forEach(el => el.addEventListener('click', () => { state.labFilter = el.dataset.labTab; render(); }));
  document.getElementById('lab-search')?.addEventListener('input', (e) => { state.labQuery = e.target.value; render(); });
  document.querySelectorAll('[data-lab-approve]').forEach(el => el.addEventListener('click', () => { reservas = reservas.map(r => r.id === Number(el.dataset.labApprove) ? { ...r, status: 'aprovada' } : r); render(); }));
  document.querySelectorAll('[data-lab-reject]').forEach(el => el.addEventListener('click', () => { reservas = reservas.map(r => r.id === Number(el.dataset.labReject) ? { ...r, status: 'recusada' } : r); render(); }));

  // Estacionamento
  document.querySelectorAll('[data-est-tab]').forEach(el => el.addEventListener('click', () => { state.estFilter = el.dataset.estTab; render(); }));
  document.getElementById('est-search')?.addEventListener('input', (e) => { state.estQuery = e.target.value; render(); });
  document.querySelectorAll('[data-est-approve]').forEach(el => el.addEventListener('click', () => { solicitacoesEst = solicitacoesEst.map(s => s.id === Number(el.dataset.estApprove) ? { ...s, status: 'aprovada' } : s); render(); }));
  document.querySelectorAll('[data-est-reject]').forEach(el => el.addEventListener('click', () => { solicitacoesEst = solicitacoesEst.map(s => s.id === Number(el.dataset.estReject) ? { ...s, status: 'recusada' } : s); render(); }));

  // Chaves
  document.querySelectorAll('[data-chave-retirar]').forEach(el => el.addEventListener('click', () => {
    const id = Number(el.dataset.chaveRetirar);
    const nome = window.prompt('Nome do responsável pela retirada:');
    if (!nome) return;
    chaves = chaves.map(c => c.id === id ? { ...c, status: 'com_terceiro', responsavel: nome, retiradaEm: 'agora' } : c);
    render();
  }));
  document.querySelectorAll('[data-chave-devolver]').forEach(el => el.addEventListener('click', () => {
    const id = Number(el.dataset.chaveDevolver);
    chaves = chaves.map(c => c.id === id ? { ...c, status: 'disponivel', responsavel: null, retiradaEm: null } : c);
    render();
  }));

  // Cantina
  document.querySelectorAll('[data-cantina-confirmar]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.cantinaConfirmar;
    const dia = cardapio.find(d => d.id === id);
    const val = window.prompt('Porções produzidas:', String(dia.previstas));
    if (val === null) return;
    cardapio = cardapio.map(d => d.id === id ? { ...d, status: 'confirmado', confirmadas: Number(val) || 0 } : d);
    render();
  }));

  // Busca Ativa
  document.querySelectorAll('[data-busca-tab]').forEach(el => el.addEventListener('click', () => { state.buscaFilter = el.dataset.buscaTab; render(); }));
  document.getElementById('busca-search')?.addEventListener('input', (e) => { state.buscaQuery = e.target.value; render(); });
  document.querySelectorAll('[data-busca-detalhe]').forEach(el => el.addEventListener('click', () => {
    const aluno = alunos.find(a => a.id === Number(el.dataset.buscaDetalhe));
    window.alert(`${aluno.nome} — ${aluno.turma}\nMotivo: ${aluno.motivo}\nFaltas: ${aluno.faltas}\nStatus: ${BUSCA_LABEL[aluno.status]}\n\n(No projeto React completo, este painel abre um Drawer com o histórico de contatos e formulário para novo registro.)`);
  }));
  document.querySelectorAll('[data-busca-resolver]').forEach(el => el.addEventListener('click', () => {
    const id = Number(el.dataset.buscaResolver);
    alunos = alunos.map(a => a.id === id ? { ...a, status: 'resolvido', atualizado: 'agora' } : a);
    render();
  }));

  // Professores
  document.getElementById('prof-search')?.addEventListener('input', (e) => { state.profQuery = e.target.value; render(); });
  document.querySelectorAll('[data-prof-editar]').forEach(el => el.addEventListener('click', () => {
    const p = professores.find(x => x.id === Number(el.dataset.profEditar));
    window.alert(`Editar vínculos de ${p.nome}\nCursos atuais: ${p.cursos.join(', ')}\n\n(No projeto React completo, isto abre um modal com checkboxes de todos os cursos disponíveis.)`);
  }));

  // Conflitos
  document.querySelectorAll('[data-conf-tab]').forEach(el => el.addEventListener('click', () => { state.confFilter = el.dataset.confTab; render(); }));
  document.getElementById('conf-search')?.addEventListener('input', (e) => { state.confQuery = e.target.value; render(); });
  document.querySelectorAll('[data-conf-resolver]').forEach(el => el.addEventListener('click', () => { conflitos = conflitos.map(c => c.id === Number(el.dataset.confResolver) ? { ...c, status: 'resolvido' } : c); render(); }));
  document.querySelectorAll('[data-conf-ignorar]').forEach(el => el.addEventListener('click', () => {
    if (!window.confirm('Tem certeza de que deseja ignorar este conflito?')) return;
    conflitos = conflitos.map(c => c.id === Number(el.dataset.confIgnorar) ? { ...c, status: 'ignorado' } : c);
    render();
  }));

  // Relatórios
  document.querySelectorAll('[data-rel-gerar]').forEach(el => el.addEventListener('click', () => {
    const tipo = tiposRelatorio.find(t => t.id === el.dataset.relGerar);
    historicoRelatorios = [{ id: Date.now(), nome: tipo.nome, periodo: 'Período selecionado', geradoEm: 'agora', formato: 'PDF' }, ...historicoRelatorios];
    render();
  }));
  document.querySelectorAll('[data-rel-baixar]').forEach(el => el.addEventListener('click', () => { window.alert('Download simulado — integração com o Back-end pendente.'); }));

  // Configurações
  document.querySelectorAll('[data-settings-tab]').forEach(el => el.addEventListener('click', () => { state.settingsTab = el.dataset.settingsTab; render(); }));
  document.getElementById('settings-theme-switch')?.addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); });
  document.querySelectorAll('[data-notif-switch]').forEach(el => el.addEventListener('click', () => {
    const key = el.dataset.notifSwitch;
    state.notif[key] = !state.notif[key];
    render();
  }));
}

render();

  </script>
</body>
</html>
